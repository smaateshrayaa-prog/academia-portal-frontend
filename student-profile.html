<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Profile - AcademiaHub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->

    <nav>

        <div class="logo">
            Academia<span>Hub</span>
        </div>

        <div class="nav-links">

            <a href="student-dashboard.html">
                Dashboard
            </a>

            <button onclick="window.location.href='index.html'">
                Logout
            </button>

        </div>

    </nav>


    <!-- Profile Page -->

    <main class="profile-page">

        <div class="profile-container">

            <p class="section-tag">
                STUDENT PROFILE
            </p>

            <h1>Build Your Profile</h1>

            <p class="profile-description">
                Add your education, skills and projects to
                improve your industry opportunities.
            </p>


            <!-- Personal Information -->

            <section class="profile-section">

                <h2>Personal Information</h2>

                <div class="form-grid">

                    <div class="form-group">

                        <label>Full Name</label>

                        <input
                            type="text"
                            id="studentName"
                            placeholder="Enter your name">

                    </div>


                    <div class="form-group">

                        <label>Email</label>

                        <input
                            type="email"
                            placeholder="Enter your email">

                    </div>


                    <div class="form-group">

                        <label>College / University</label>

                        <input
                            type="text"
                            placeholder="Enter your institution">

                    </div>


                    <div class="form-group">

                        <label>Course</label>

                        <input
                            type="text"
                            placeholder="Example: B.Tech CSE">

                    </div>


                    <div class="form-group">

                        <label>Year of Study</label>

                        <select>

                            <option>Select year</option>
                            <option>1st Year</option>
                            <option>2nd Year</option>
                            <option>3rd Year</option>
                            <option>4th Year</option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>Location</label>

                        <input
                            type="text"
                            placeholder="City">

                    </div>

                </div>

            </section>


            <!-- Skills -->

            <section class="profile-section">

                <h2>Technical Skills</h2>

                <p class="help-text">
                    Select the technologies you know.
                </p>


                <div class="skills-list">

                    <label class="skill-option">
                        <input type="checkbox">
                        HTML
                    </label>

                    <label class="skill-option">
                        <input type="checkbox">
                        CSS
                    </label>

                    <label class="skill-option">
                        <input type="checkbox">
                        JavaScript
                    </label>

                    <label class="skill-option">
                        <input type="checkbox">
                        Python
                    </label>

                    <label class="skill-option">
                        <input type="checkbox">
                        Java
                    </label>

                    <label class="skill-option">
                        <input type="checkbox">
                        React
                    </label>

                    <label class="skill-option">
                        <input type="checkbox">
                        Node.js
                    </label>

                    <label class="skill-option">
                        <input type="checkbox">
                        SQL
                    </label>

                    <label class="skill-option">
                        <input type="checkbox">
                        Cloud Computing
                    </label>

                    <label class="skill-option">
                        <input type="checkbox">
                        AI / ML
                    </label>

                </div>

            </section>


            <!-- Soft Skills -->

            <section class="profile-section">

                <h2>Soft Skills</h2>

                <div class="skills-list">

                    <label class="skill-option">
                        <input type="checkbox">
                        Communication
                    </label>

                    <label class="skill-option">
                        <input type="checkbox">
                        Leadership
                    </label>

                    <label class="skill-option">
                        <input type="checkbox">
                        Teamwork
                    </label>

                    <label class="skill-option">
                        <input type="checkbox">
                        Problem Solving
                    </label>

                </div>

            </section>


            <!-- Projects -->

            <section class="profile-section">

                <h2>Projects</h2>

                <div class="form-group">

                    <label>Project Name</label>

                    <input
                        type="text"
                        placeholder="Example: Smart Campus">

                </div>


                <div class="form-group">

                    <label>Project Description</label>

                    <textarea
                        placeholder="Describe your project"></textarea>

                </div>

            </section>


            <!-- Save -->

            <div class="save-profile">

                <button
                    class="primary-btn"
                    onclick="saveProfile()">

                    Save Profile

                </button>

            </div>

        </div>

    </main>


    <script>

        function saveProfile() {

            const name =
                document.getElementById("studentName").value;

            if (name === "") {

                alert("Please enter your name.");

                return;

            }

            alert(
                "Profile saved successfully! 🎉"
            );

        }

    </script>

</body>

</html>
